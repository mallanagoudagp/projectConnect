<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI Integration Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            line-height: 1.6;
        }
        .card {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 1.5rem;
            margin: 1rem 0;
            background: #fff;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
        }
        button:hover { background: #2563eb; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        .success { color: #059669; background: #ecfdf5; padding: 1rem; border-radius: 6px; }
        .error { color: #dc2626; background: #fef2f2; padding: 1rem; border-radius: 6px; }
        .status-pending { background: #fef3c7; color: #d97706; padding: 0.25rem 0.75rem; border-radius: 4px; }
        .status-approved { background: #d1fae5; color: #065f46; padding: 0.25rem 0.75rem; border-radius: 4px; }
        .status-refunded { background: #dbeafe; color: #1e40af; padding: 0.25rem 0.75rem; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>🚀 FastAPI + Next.js Integration Test</h1>
    
    <div class="card">
        <h2>Backend Status</h2>
        <p>FastAPI Backend: <span id="backend-status">Checking...</span></p>
        <p>Next.js Frontend: <span style="color: #059669;">Connected ✓</span></p>
    </div>

    <div class="card">
        <h2>Payment API Test</h2>
        <div style="margin-bottom: 1rem;">
            <label>Amount: </label>
            <input type="number" id="amount" value="100" style="padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 4px;">
            <label style="margin-left: 1rem;">Gateway: </label>
            <input type="text" id="gateway" value="frontend_test" style="padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 4px;">
        </div>
        <button onclick="createPayment()">Create Payment</button>
        <div id="payment-result"></div>
    </div>

    <div class="card">
        <h2>Test Logs</h2>
        <div id="logs" style="background: #f9fafb; padding: 1rem; border-radius: 4px; max-height: 300px; overflow-y: auto;"></div>
    </div>

    <script>
        let currentPayment = null;

        function log(message) {
            const logs = document.getElementById('logs');
            const timestamp = new Date().toLocaleTimeString();
            logs.innerHTML += `<div>[${timestamp}] ${message}</div>`;
            logs.scrollTop = logs.scrollHeight;
        }

        // Check backend status
        async function checkBackend() {
            try {
                const response = await fetch('http://localhost:8000/health');
                const data = await response.json();
                document.getElementById('backend-status').innerHTML = '<span style="color: #059669;">Connected ✓</span>';
                log('✅ Backend API connected successfully');
            } catch (error) {
                document.getElementById('backend-status').innerHTML = '<span style="color: #dc2626;">Failed ✗</span>';
                log('❌ Backend API connection failed: ' + error.message);
            }
        }

        // Create payment
        async function createPayment() {
            const amount = document.getElementById('amount').value;
            const gateway = document.getElementById('gateway').value;
            const result = document.getElementById('payment-result');
            
            log(`🔄 Creating payment: $${amount} via ${gateway}`);
            
            try {
                const response = await fetch('http://localhost:8000/payments/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        subscription_id: 1,
                        amount: parseFloat(amount),
                        gateway_id: gateway
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${await response.text()}`);
                }

                const payment = await response.json();
                currentPayment = payment;
                
                result.innerHTML = `
                    <div class="card" style="background: #f0f9ff;">
                        <h3>💳 Payment Created</h3>
                        <p><strong>ID:</strong> ${payment.id}</p>
                        <p><strong>Amount:</strong> $${payment.amount}</p>
                        <p><strong>Status:</strong> <span class="status-${payment.status}">${payment.status.toUpperCase()}</span></p>
                        <p><strong>Gateway:</strong> ${payment.gateway_id}</p>
                        <p><strong>Subscription ID:</strong> ${payment.subscription_id}</p>
                        <hr>
                        <button onclick="approvePayment()">✅ Approve Payment</button>
                        <button onclick="refundPayment()">🔄 Refund Payment</button>
                    </div>
                `;
                
                log(`✅ Payment created successfully: ID ${payment.id}, Status: ${payment.status}`);
                
            } catch (error) {
                result.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
                log(`❌ Failed to create payment: ${error.message}`);
            }
        }

        // Approve payment
        async function approvePayment() {
            if (!currentPayment) {
                log('❌ No payment to approve');
                return;
            }

            log(`🔄 Approving payment ${currentPayment.id}`);
            
            try {
                const response = await fetch(`http://localhost:8000/payments/${currentPayment.id}/approve`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        idempotency_key: `approve-${currentPayment.id}-${Date.now()}`
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${await response.text()}`);
                }

                const approvedPayment = await response.json();
                currentPayment.status = approvedPayment.status;
                
                // Update the UI
                const statusSpan = document.querySelector('.status-pending');
                if (statusSpan) {
                    statusSpan.className = 'status-approved';
                    statusSpan.textContent = 'APPROVED';
                }
                
                log(`✅ Payment ${currentPayment.id} approved successfully`);
                
            } catch (error) {
                log(`❌ Failed to approve payment: ${error.message}`);
            }
        }

        // Refund payment
        async function refundPayment() {
            if (!currentPayment) {
                log('❌ No payment to refund');
                return;
            }

            log(`🔄 Refunding payment ${currentPayment.id}`);
            
            try {
                const response = await fetch(`http://localhost:8000/payments/${currentPayment.id}/refund`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        idempotency_key: `refund-${currentPayment.id}-${Date.now()}`
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${await response.text()}`);
                }

                const refundedPayment = await response.json();
                currentPayment.status = refundedPayment.status;
                
                // Update the UI
                const statusSpan = document.querySelector('.status-approved');
                if (statusSpan) {
                    statusSpan.className = 'status-refunded';
                    statusSpan.textContent = 'REFUNDED';
                }
                
                log(`✅ Payment ${currentPayment.id} refunded successfully`);
                
            } catch (error) {
                log(`❌ Failed to refund payment: ${error.message}`);
            }
        }

        // Initialize
        window.addEventListener('load', () => {
            log('🚀 Frontend loaded, checking backend connection...');
            checkBackend();
        });
    </script>
</body>
</html>
